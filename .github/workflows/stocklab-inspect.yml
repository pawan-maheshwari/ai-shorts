name: Stock Lab inspect
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12"}
      - run: pip install playwright && python -m playwright install --with-deps chromium
      - run: python tools/stocklab_inspect.py
      - name: Publish results to the stocklab-inspect branch
        if: always()
        run: |
          mkdir -p /tmp/out && cp -r inspect/. /tmp/out/ || true
          git config user.name "stocklab-bot" && git config user.email "actions@github.com"
          git checkout --orphan stocklab-inspect && git rm -rqf . && cp -r /tmp/out/. . && git add -A
          git commit -qm "inspect $(date -u +%FT%TZ)" && git push -qf origin stocklab-inspect
