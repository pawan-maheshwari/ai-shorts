name: Daily AI headlines
on:
  workflow_dispatch: {}
permissions:
  contents: read
  models: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          U=https://models.github.ai/inference/chat/completions
          B='{"model":"MODEL","messages":[{"role":"user","content":"Reply with the single word: ready"}],"max_tokens":20}'
          p(){ echo "=== $1"; shift; curl -sS -m 40 -w '\n[http %{http_code} %{content_type}]\n' "$@" | head -c 700; echo; }
          echo "=== catalog"; curl -sS -m 30 -H "Authorization: Bearer $GITHUB_TOKEN" https://models.github.ai/catalog/models | jq -r '.[] | "\(.id) | \(.rate_limit_tier // "-") | in \(.limits.max_input_tokens // "-")"' | head -80
          p "A docs form gpt-4.1" -L -X POST $U -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" -d "${B/MODEL/openai\/gpt-4.1}"
          p "B docs form gpt-4o-mini" -L -X POST $U -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2026-03-10" -H "Content-Type: application/json" -d "${B/MODEL/openai\/gpt-4o-mini}"
          p "C bare gpt-4o-mini" $U -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "${B/MODEL/openai\/gpt-4o-mini}"
          p "D old version header" -X POST $U -H "Accept: application/vnd.github+json" -H "Authorization: Bearer $GITHUB_TOKEN" -H "X-GitHub-Api-Version: 2022-11-28" -H "Content-Type: application/json" -d "${B/MODEL/openai\/gpt-4o-mini}"
          p "E node UA" -A node $U -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d "${B/MODEL/openai\/gpt-4o-mini}"
