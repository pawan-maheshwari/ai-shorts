name: Daily AI headlines
on:
  workflow_dispatch: {}
permissions:
  contents: read
  models: read
jobs:
  fetch:
    runs-on: ubuntu-latest
    steps:
      - name: Probe GitHub Models
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "=== headers catalog"; curl -sS -m 30 -D - -o /dev/null -H "Authorization: Bearer $GITHUB_TOKEN" https://models.github.ai/catalog/models | head -30
          echo "=== headers inference"; curl -sS -m 30 -D - -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" https://models.github.ai/inference/chat/completions -d '{"model":"openai/gpt-4.1","messages":[{"role":"user","content":"Say ready"}]}' | head -40
          echo "=== no auth"; curl -sS -m 30 -w '\n[http %{http_code}]\n' https://models.github.ai/inference/chat/completions -H "Content-Type: application/json" -d '{}' | head -c 300
          echo "=== azure endpoint"; curl -sS -m 40 -w '\n[http %{http_code} %{content_type}]\n' https://models.inference.ai.azure.com/chat/completions -H "Authorization: Bearer $GITHUB_TOKEN" -H "Content-Type: application/json" -d '{"model":"gpt-4o-mini","messages":[{"role":"user","content":"Reply with the single word: ready"}],"max_tokens":20}' | head -c 700
          echo "=== dns"; getent hosts models.github.ai || true
