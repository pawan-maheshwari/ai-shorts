name: Stock Lab market hours

# Stock Lab's agents only run while the app is open in a browser: the Intraday tab re-runs itself every
# 2 minutes, but only inside a live session. This holds one headless session open through the NSE session
# so signals are found and paper-traded as they fire, not hours later.
# A job can run at most 6 hours, so the day is split into two watches (times in UTC, Mon–Fri):
#   03:35 UTC = 09:05 IST → watches until 12:20 IST
#   06:45 UTC = 12:15 IST → watches until 15:35 IST (after the 15:15 exit and 15:30 close)
# Each watch stops at its IST end time, so a late-starting schedule never overruns.
# NSE holidays: the app shows "Market closed" and simply finds nothing — harmless.
on:
  schedule:
    # GitHub often starts scheduled runs late and sometimes skips them (on 19 Nov no schedule in this repo
    # fired between 00:43 and 05:00 UTC). So each window has back-up starts; a back-up that finds its
    # window already being watched waits in the concurrency queue and exits at once when it gets its turn.
    - cron: "35 3 * * 1-5"    # morning window, 09:05 IST
    - cron: "5 4 * * 1-5"     # back-up, 09:35 IST
    - cron: "40 4 * * 1-5"    # back-up, 10:10 IST
    - cron: "45 6 * * 1-5"    # afternoon window, 12:15 IST
    - cron: "20 7 * * 1-5"    # back-up, 12:50 IST
  workflow_dispatch:
    inputs:
      until:
        description: "Watch until (IST, HH:MM)"
        default: "15:35"

permissions:
  contents: read

concurrency:
  group: stocklab-market-${{ github.event_name == 'workflow_dispatch' && 'manual' || (contains(fromJSON('["35 3 * * 1-5","5 4 * * 1-5","40 4 * * 1-5"]'), github.event.schedule) && 'am' || 'pm') }}
  cancel-in-progress: false

jobs:
  watch:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # Preferred: run the agent cycle headlessly here (no browser, no Streamlit Cloud session). Needs the app's
      # secrets as repository secrets — at least SUPABASE_URL and SUPABASE_KEY, plus the LLM key the desk uses.
      # Without them the cycle exits with code 3 and the browser watch below takes over, as before.
      - name: Install app dependencies
        run: pip install -r apps/stock-lab/requirements.txt

      - name: Run the agent cycle headlessly
        id: cycle
        continue-on-error: true
        env:
          STOCKLAB_UNTIL: ${{ github.event.inputs.until || (contains(fromJSON('["35 3 * * 1-5","5 4 * * 1-5","40 4 * * 1-5"]'), github.event.schedule) && '12:20') || '15:35' }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_KEY: ${{ secrets.SUPABASE_KEY }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          LLM_PROVIDER: ${{ secrets.LLM_PROVIDER }}
          LLM_MODEL_FAST: ${{ secrets.LLM_MODEL_FAST }}
          LLM_MODEL_SMART: ${{ secrets.LLM_MODEL_SMART }}
        run: python tools/stocklab_cycle.py

      - name: Install headless browser
        if: steps.cycle.outcome == 'failure'
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium

      - name: Watch Stock Lab through the session (fallback)
        if: steps.cycle.outcome == 'failure'
        env:
          STOCKLAB_UNTIL: ${{ github.event.inputs.until || (contains(fromJSON('["35 3 * * 1-5","5 4 * * 1-5","40 4 * * 1-5"]'), github.event.schedule) && '12:20') || '15:35' }}
        run: python tools/stocklab_watch.py

      - name: Keep the screenshot if it failed
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: stocklab-watch-screenshot
          path: stocklab-watch.png
          if-no-files-found: ignore
